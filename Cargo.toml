[workspace]
resolver = "2"
members = [
    "forge-core",
    "script-forge",
    "runtime-abstraction",
    "runtime-light",
    "extension-registry",
    "asset-forge",
    "build-pipeline",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/youbanzhishi/open-forge"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

forge-core = { path = "forge-core" }
script-forge = { path = "script-forge" }
runtime-abstraction = { path = "runtime-abstraction" }
extension-registry = { path = "extension-registry" }
asset-forge = { path = "asset-forge" }
build-pipeline = { path = "build-pipeline" }
